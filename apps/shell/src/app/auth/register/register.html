
<lib-app-toast-component></lib-app-toast-component>
<div class="register">
<div class="container vh-100 d-flex justify-content-center align-items-center text-center">
  <div class="card p-4 shadow  bg-dark text-white">
    <h3 class="text-center mb-3">Register</h3>
    <form (ngSubmit)="onSubmit(registerForm)" #registerForm="ngForm">
        <div class="mb-3">
        <input
            type="text"
            class="form-control"
            placeholder="Username"
            [(ngModel)]="registerModel.username"
            required
            name="username"
        />
        </div>
        <div class="mb-3">
        <input
            type="text"
            class="form-control"
            placeholder="Email"
            required
            [(ngModel)]="registerModel.email"
            name="email"
        />
        </div>

        <div class="mb-3">
        <input
            type="password"
            class="form-control"
            placeholder="Password"
            required
            [(ngModel)]="registerModel.password"
            autocomplete="new-password"
            name="password"
        />
        </div>
        <div class="mb-3">
          <select
            class="form-select"
            name="role"
            required
            [(ngModel)]="registerModel.role"
          >
            <option value="" disabled>Select role</option>
            <option value="PASSENGER">Passenger</option>
            <option value="OWNER">Owner</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="registerForm.invalid">
            Register
        </button>
        <div class="mt-2 " *ngIf="successMsg">
          <small class="text-success">
            {{successMsg}}
          </small>
        </div>
    </form>
    <div class="text-center1 mt-3">
      Already have Account?<a routerLink="/login" > Login</a>
    </div>
      <hr />
      <div class="text-center1">
        <a routerLink="/" class="text-decoration-none text-warning">
          ← Back to Home
        </a>
      </div>
  </div>
</div>
</div>
