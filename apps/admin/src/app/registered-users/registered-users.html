<h3 class="mb-3">Registered Users</h3>
<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th>#</th>
      <th>Username</th>
      <th>Role</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let u of users; index as i">
      <td>{{ i + 1 }}</td>
      <td>{{ u.username }}</td>
      <td>
        <span class="badge bg-secondary">{{ u.role }}</span>
      </td>
    </tr>
  </tbody>
</table>
